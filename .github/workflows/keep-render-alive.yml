name: Keep CAMPRO Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CAMPRO health endpoint
        run: |
          set -e
          status=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://nhom-8-campro.onrender.com/health")
          echo "CAMPRO /health -> HTTP $status"
          test "$status" -ge 200
          test "$status" -lt 400
